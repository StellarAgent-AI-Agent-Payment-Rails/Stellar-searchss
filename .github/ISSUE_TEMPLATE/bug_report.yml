name: Bug report
about: Report a reproducible bug in the app
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please read [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) first and fill in every required field so we can reproduce the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps that reliably reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where did you see the bug? Include OS, browser, and app version.
      placeholder: |
        - OS: macOS 14.5
        - Browser: Chrome 126
        - App version: 1.2.3
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Paste any relevant errors from the browser console.
      render: shell
    validations:
      required: true

  - type: textarea
    id: network
    attributes:
      label: Network tab
      description: Paste relevant failed requests from the browser Network tab (status, URL, response).
      render: shell
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context, screenshots, or links about the problem.
    validations:
      required: false
